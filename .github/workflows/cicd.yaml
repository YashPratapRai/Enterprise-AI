
name: Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ai-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python Syntax
        run: |
          python -m compileall -q app worker scripts

  # ==========================================
  # 2. BUILD AND PUSH IMAGE TO ECR
  # ==========================================

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image..."
          docker build -t "$IMAGE" .

          echo "Pushing Docker image to ECR..."
          docker push "$IMAGE"

          echo "Docker image pushed successfully"

  # ==========================================
  # 3. DEPLOY TO EC2
  # ==========================================

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: [self-hosted, linux, x64, enterprise-ai-ec2]
    environment: production

    steps:

      # ----------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # CONSTRUCT IMAGE URI
      # ----------------------------------------

      - name: Construct ECR Image URI
        id: image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ECR image URI constructed successfully"

      # ----------------------------------------
      # DISK CHECK
      # ----------------------------------------

      - name: Check EC2 Disk Space
        run: |
          set -euo pipefail

          echo "Disk usage:"
          df -h /

          echo "Docker disk usage:"
          docker system df

      # ----------------------------------------
      # PULL IMAGE
      # ----------------------------------------

      - name: Pull Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          echo "Docker image pulled successfully"

      # ----------------------------------------
      # VALIDATE APPLICATION SECRETS
      # ----------------------------------------

      - name: Validate Application Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          BEDROCK_EMBED_MODEL: ${{ secrets.BEDROCK_EMBED_MODEL }}
          BEDROCK_CHAT_MODEL: ${{ secrets.BEDROCK_CHAT_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
          RIUS_SERVICE_NAME: ${{ secrets.RIUS_SERVICE_NAME }}
          RIUS_DISABLED: ${{ secrets.RIUS_DISABLED }}
          RIUS_CAPTURE_CONTENT: ${{ secrets.RIUS_CAPTURE_CONTENT }}

          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}

        run: |
          set -euo pipefail

          REQUIRED=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            S3_BUCKET
            BEDROCK_EMBED_MODEL
            BEDROCK_CHAT_MODEL
            EMBED_DIM
            PINECONE_API_KEY
            PINECONE_INDEX_NAME
            PINECONE_CLOUD
            PINECONE_REGION
            PINECONE_READY_TIMEOUT
            DATABASE_URL
            RIUS_API_KEY
            RIUS_SERVICE_NAME
            RIUS_DISABLED
            RIUS_CAPTURE_CONTENT
            HITL_ENABLED
            MEMORY_TURNS
          )

          for name in "${REQUIRED[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Environment Secret: $name"
              exit 1
            fi
          done

          echo "All required application secrets are available"

      # ----------------------------------------
      # STOP OLD CONTAINER
      # ----------------------------------------

      - name: Stop Old Container
        run: |
          docker rm -f enterprise-ai || true

      # ----------------------------------------
      # START NEW CONTAINER
      # ----------------------------------------

      - name: Start New Container
        env:
          IMAGE: ${{ steps.image.outputs.image }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          BEDROCK_EMBED_MODEL: ${{ secrets.BEDROCK_EMBED_MODEL }}
          BEDROCK_CHAT_MODEL: ${{ secrets.BEDROCK_CHAT_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
          RIUS_SERVICE_NAME: ${{ secrets.RIUS_SERVICE_NAME }}
          RIUS_DISABLED: ${{ secrets.RIUS_DISABLED }}
          RIUS_CAPTURE_CONTENT: ${{ secrets.RIUS_CAPTURE_CONTENT }}

          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}

        run: |
          set -euo pipefail

          docker run -d \
            --name enterprise-ai \
            --restart unless-stopped \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -e S3_BUCKET \
            -e BEDROCK_EMBED_MODEL \
            -e BEDROCK_CHAT_MODEL \
            -e EMBED_DIM \
            -e PINECONE_API_KEY \
            -e PINECONE_INDEX_NAME \
            -e PINECONE_CLOUD \
            -e PINECONE_REGION \
            -e PINECONE_READY_TIMEOUT \
            -e DATABASE_URL \
            -e RIUS_API_KEY \
            -e RIUS_SERVICE_NAME \
            -e RIUS_DISABLED \
            -e RIUS_CAPTURE_CONTENT \
            -e HITL_ENABLED \
            -e MEMORY_TURNS \
            -p 8000:8000 \
            "$IMAGE"

          echo "New container started"

      # ----------------------------------------
      # DIAGNOSE DEPLOYMENT CONNECTION
      # ----------------------------------------

      - name: Diagnose Deployment Connection
        run: |
          echo "===== RUNNER INFORMATION ====="
          hostname
          whoami
          pwd

          echo "===== CONTAINER STATUS ====="
          docker ps -a --filter name=enterprise-ai

          echo "===== PORT 8000 ====="
          sudo ss -lntp | grep 8000 || true

          echo "===== HEALTH CHECK ====="
          curl -v --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:8000/health/live || true

          echo "===== CONTAINER LOGS ====="
          docker logs --tail 50 enterprise-ai

      # ----------------------------------------
      # VERIFY DEPLOYMENT
      # ----------------------------------------

      - name: Verify Deployment
        run: |
          set -euo pipefail

          echo "Waiting for application startup..."
          sleep 10

          if ! docker inspect \
            -f '{{.State.Running}}' \
            enterprise-ai | grep -qx true; then

            echo "::error::Container is not running"
            docker logs --tail 100 enterprise-ai
            exit 1
          fi

          if ! curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            --max-time 10 \
            http://127.0.0.1:8000/health/live \
            > /dev/null; then

            echo "::error::Health check failed"
            docker logs --tail 100 enterprise-ai
            exit 1
          fi

          echo "Enterprise AI deployed successfully"

      # ----------------------------------------
      # CLEAN UNUSED DOCKER IMAGES
      # ----------------------------------------

      - name: Clean Unused Docker Images
        if: success()
        run: |
          set -euo pipefail

          echo "Removing unused Docker images..."
          docker image prune -a -f

          echo "Final disk usage:"
          df -h /

          echo "Final Docker disk usage:"
          docker system df

          echo "Docker cleanup completed"
